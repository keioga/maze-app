<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傾きの値を見る</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>傾きの値</h1>
  <button id="startBtn">センサー開始</button>

  </div>
  <p class="note">パソコンでは矢印キーで試せます</p>
  <script src="app.js"></script>
